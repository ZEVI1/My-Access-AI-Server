name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore My-Access-AI-Server.sln
      - name: Build solution
        run: dotnet build My-Access-AI-Server.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test My-Access-AI-Server.sln --configuration Release --no-build --verbosity normal
