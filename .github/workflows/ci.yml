name: .NET Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore My-Access-AI-Server.sln

      - name: Build solution
        run: dotnet build My-Access-AI-Server.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test My-Access-AI-Server.sln -c Release --no-restore
